# NGD Pipeline Configuration
# Local paths are relative to this config file's directory unless absolute

paths:
  # Base location: local directory, s3://bucket/base or
  # az://account.blob.core.windows.net/container/base
  # Final files go to <base>/output; cloud bases keep processing local.
  work_dir: ./data
  # Local downloads, intermediates and spill for a cloud base (default ./data)
  # cache_dir: ./data
  # Optional exact final location instead of <base>/output:
  # overrides:
  #   output_dir: s3://my-address-bucket/canonical/ngd

# Optional AWS identity/encryption settings when the output path is S3.
# Install ukam-os-builder[aws] or ukam-os-builder[azure].
# output:
#   aws:
#     region: eu-west-2
#     profile: development
#     credential_chain: [sso]  # Run aws sso login first; omit profile/chain for IAM jobs.
#     kms_key_id: arn:aws:kms:eu-west-2:123456789012:key/your-key-id
# One writer per source/prefix; readers wait for _ukam_SOURCE_output.json.
# --overwrite removes old source chunks and does not preserve last-good output on failure.

# OS Data Hub download settings
# Given a datapackage at: https://osdatahub.os.uk/data/downloads/data-packages/16331
# You can get versions from:
#   Base: https://api.os.uk/downloads/v1
#   Auth: send header key: OS_PROJECT_API_KEY
#   GET /dataPackages/16331/versions

# Hackney only:
os_downloads:
  # Data package ID from OS Data Hub
  package_id: "18296"
  # Version ID (update this when new data is released)
  version_id: "118120"

# Full supply
# os_downloads:
#   # Data package ID from OS Data Hub
#   package_id: "16465"
#   # Version ID (update this when new data is released)
#   version_id: "104444"

# Processing options
processing:
  # NGD source Parquets retain only fields used by canonical building.
  # Set true to keep every source column; use --force after changing this option.
  ngd_keep_all_columns: false
  # Opt in to parallel NGD extraction to temporary CSVs and parallel CSV parsing.
  # Allow local disk space for several full uncompressed CSVs and DuckDB spill files.
  # Install rapidgzip to decompress each DEFLATE member with 16 threads in this mode.
  ngd_extract_to_disk: false
  ngd_stage_csv_in_ram: false
  # Parquet compression settings
  parquet_compression: zstd
  parquet_compression_level: 9

  # DuckDB memory limit (optional)
  # If set, limits how much RAM DuckDB can use (e.g., '4GB', '500MB')
  # Useful for testing on low-memory machines
  # If not set, DuckDB uses its default (80% of physical RAM)
  # duckdb_memory_limit: "8GB"

  # Number of chunks to split flatfile processing into (default: 1)
  # Use higher values (e.g., 10) for lower memory usage on laptops
  # Output will be split into multiple parquet files, one per chunk
  num_chunks: 20

  # NGD feature stems to exclude from download, extract, and flatfile processing
  # Historic addresses are excluded by default
  # Valid values: builtaddress, prebuildaddress, historicaddress,
  # nonaddressableobject, royalmailaddress
  # Matching alternate-address files are excluded with their feature stem.
  ngd_excluded_stems:
    - historicaddress

  # ABP LPI logical statuses to exclude from flatfile processing
  # Logical status 8 is excluded by default
  # Valid values: 1 (approved), 3 (alternative), 6 (provisional), 8 (historic)
  abp_excluded_logical_statuses:
    - 8
