name: Build and package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ukam_os_builder/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "shell/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    env:
      UV_NO_DEV: "true"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check ukam_os_builder/ tests/

      - name: Test
        run: uv run pytest

      - name: Build sdist + wheel
        run: uv run --with build python -m build

      - name: Check package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Smoke test wheel installs and CLI
        run: |
          uv venv .venv-wheeltest -p 3.10 --clear
          uv pip install --python .venv-wheeltest/bin/python dist/*.whl
          .venv-wheeltest/bin/python -c "import ukam_os_builder; print('Imported ukam_os_builder OK')"
          .venv-wheeltest/bin/ukam-os-build --help
          .venv-wheeltest/bin/ukam-os-setup --help

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*